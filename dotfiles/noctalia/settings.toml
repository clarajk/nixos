config_version = 12

[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
center = [ "group:g1", "Generic_Spacer", "clock", "Generic_Spacer", "weather" ]
end = [
    "group:g2",
    "group:g3",
    "clipboard",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
margin_edge = 4
margin_opposite_edge = 4
panel_overlap = 0
radius = 8
start = [ "control-center", "wallpaper", "workspaces", "Generic_Spacer", "active_window" ]

    [bar.default.monitor.DP-2]
    enabled = false

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "temp", "cpu", "ram", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "Generic_Spacer", "tray", "Generic_Spacer" ]
    opacity = 1.0
    padding = 6.0

[control_center]
sidebar = "full"
sidebar_section = "full"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Tucson, Arizona"
auto_locate = true

[lockscreen]
fingerprint = false
monitors = [ "DP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 64.0
    box_width = 400.0
    cx = 1720.0
    cy = 720.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 1.0
        background_radius = 8.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 8.0
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 468.5
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        center_text = true
        format = "{:%l:%M %p}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 256.0
    cx = 1720.0
    cy = 513.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background_opacity = 0.0
        format = "{:%A, %B %e, %Y}"

[osd]
background_opacity = 0.99999997764825821

[shell]
avatar_path = "/home/clara/Pictures/avatar.jpg"
date_format = "%A, %B %e, %Y"
external_ip_enabled = true
font_family = "Inter"
lang = "en"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true
time_format = "{:%l:%M %p}"

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true

    [shell.session]
    grid_columns = 2

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt", "starship" ]
    community_ids = [ "zed", "prismlauncher", "steam", "papirus-icons", "lazygit", "yazi" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/clara/Pictures/Wallpapers/323102.jpg"

    [wallpaper.last]
    path = "/home/clara/Pictures/Wallpapers/323102.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/clara/Pictures/Wallpapers/323102.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/clara/Pictures/Wallpapers/323102.jpg"

[weather]
unit = "imperial"

[widget.Generic_Spacer]
type = "spacer"

[widget.active_window]
title_scroll = "always"

[widget.audio_visualizer]
show_when_idle = true

[widget.clock]
format = "{:%l:%M %p} | {:%A, %B %e, %Y}"

[widget.control-center]
glyph = "settings"

[widget.media]
capsule = true
capsule_padding = 12

[widget.network]
show_label = false

[widget.workspaces]
active_pill_size = 1.8500000000000001
show_labels = false